# 10-mysql-secret.yaml
# 示範用途的密碼放這裡；正式環境請改用 External Secrets Operator
# 或 AWS Secrets Manager + Pod Identity，不要把明碼 commit 進 Git。
#
# 帳號用途：
#   root  -> 僅叢集內部初始化/維運（探針、複寫 bootstrap）
#   repl  -> primary/replica 之間的複寫帳號（含 BACKUP_ADMIN 供 CLONE）
#   app   -> 應用程式連線用，最小權限（只對應用 DB 做 CRUD），不給 root
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: asiayo
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "CHANGE_ME_root"
  MYSQL_REPL_USER: "repl"
  MYSQL_REPL_PASSWORD: "CHANGE_ME_repl"
  MYSQL_APP_USER: "asiayo_app"
  MYSQL_APP_PASSWORD: "CHANGE_ME_app"
  MYSQL_DATABASE: "asiayo"
